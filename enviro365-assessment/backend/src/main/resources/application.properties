spring.application.name=enviro365-withdrawals

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:enviro365db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console (handy for demoing in the interview: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

server.port=8080

# CORS is handled in WebConfig.java rather than here, so the frontend (served
# separately, e.g. from a simple static server) can call the API.
